[project]
name = "hooshek"
version = "2.0"
description = "A CLI application for managing time based sport competitions"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "sobulik"}
]
maintainers = [
    {name = "janhalama", email = "<mail@janhalama.cz>"}
]
keywords = ["sport", "race", "timer"]
dependencies = [
    "cerberus~=1.3.5",
    "pydantic>=2.13.4",
    "pyyaml~=6.0.2",
    "termtables~=0.2.4",
    "typer>=0.27.2",
]
license = {text = "MIT"}

[dependency-groups]
lint = [
    "ruff>=0.15.18",
]
test = [
    "pytest~=9.0.3",
]
typechecker = [
    "ty>=0.0.51",
]

[build-system]
requires = ["uv_build >= 0.12.5, <0.13"]
build-backend = "uv_build"

[project.scripts]
hooshek = "hooshek.cli:app"

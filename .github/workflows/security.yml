name: Security
on:
  push:
    #branches: ["master"]
  #pull_request:
  #  branches: ["master"]
  schedule:
    - cron: "37 6 * * 2"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Tool uv setup and sync
        uses: ./.github/actions/setup-sync

      - name: Run uv audit
        run: uv audit

  codeQL:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
        - language: python
    steps:
      - *checkout

      - name: Tool uv setup and sync
        uses: ./.github/actions/setup-sync

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"

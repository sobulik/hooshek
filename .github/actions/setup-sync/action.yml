inputs:
  python-version:
    required: false
    default: ""
  groups:
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup-uv
      with:
        python-version: ${{ inputs.python-version }}

    - uses: ./.github/actions/sync-uv
      with:
        groups: ${{ inputs.groups }}
